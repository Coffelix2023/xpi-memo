# pnpm 安全策略白名单:允许必要的安装期构建脚本 + 豁免 pi 官方包的最小发布龄期
packages:
  - .
allowBuilds:
  "@google/genai": true
  esbuild: true
  protobufjs: true
minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@0.84.4 || 0.87.1 || 1.0.1 || 1.4.0'
  - '@earendil-works/pi-ai@0.84.4 || 0.87.1 || 1.0.1 || 1.4.0'
  - '@earendil-works/pi-client@0.84.4'
  - '@earendil-works/pi-coding-agent@0.84.4 || 0.87.1 || 1.0.1 || 1.4.0'
  - '@earendil-works/pi-protocol@0.84.4'
  - '@earendil-works/pi-telemetry@0.84.4 || 0.87.1 || 1.0.1 || 1.4.0'
  - '@earendil-works/pi-tui@0.84.4 || 0.87.1 || 1.0.1 || 1.4.0'
  - '@earendil-works/chord@0.87.1 || 1.0.1'
  - '@earendil-works/pi-codemode@1.0.1 || 1.4.0'
  - '@earendil-works/pi-mcp@1.0.1 || 1.4.0'
  - '@biomejs/biome@2.6.3'
  - '@biomejs/cli-android-arm64@2.6.3'
  - '@biomejs/cli-android-x64@2.6.3'
  - '@biomejs/cli-darwin-arm64@2.6.3'
  - '@biomejs/cli-darwin-x64@2.6.3'
  - '@biomejs/cli-linux-arm64-musl@2.6.3'
  - '@biomejs/cli-linux-arm64@2.6.3'
  - '@biomejs/cli-linux-x64-musl@2.6.3'
  - '@biomejs/cli-linux-x64@2.6.3'
  - '@biomejs/cli-win32-arm64@2.6.3'
  - '@biomejs/cli-win32-x64@2.6.3'
