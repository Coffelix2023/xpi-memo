<!DOCTYPE html>
<html class="dark" lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XpiMemo TUI 面板原型</title>
<script>
/* 首帧前应用主题与语言，避免闪烁。只改 DOM；语言变量由主脚本启动时读回。 */
(function () {
  try {
    var prefs = JSON.parse(localStorage.getItem("xpi-memo-proto") || "{}");
    if (prefs.theme === "light") document.documentElement.classList.remove("dark");
    if (prefs.lang === "en") document.documentElement.lang = "en";
  } catch (e) {
    /* localStorage 不可用（隐私模式等）时静默回落默认值 */
  }
})();
</script>
<style>
      /* ============================================================
         Design tokens — 数值逐字取自 <项目根>/THEMES.md (shadcn oklch)。
         本文件不新增色值;下面的 --term-* 只做语义重命名,不改数值:
           --term-accent        <- --primary           选中行 / 激活 tab / 焦点
           --term-border        <- --border            普通边框与分割线
           --term-border-accent <- --primary           面板外框
           --term-muted         <- --muted-foreground  次要信息 (当前值、计数)
           --term-dim           <- --muted-foreground  弱化提示 (键位、说明)
           --term-panel         <- --popover           浮层背景
           --term-bg            <- --background        舞台背景
           --term-danger        <- --destructive       拒绝 / 失败
         THEMES.md 没有 success / warning 语义色,状态符号因此复用
         accent (警告) 与 muted (成功),见 plan.md 未决问题 6。
         ============================================================ */
      :root {
        --background: oklch(0.9818 0.0054 95.0986);
        --foreground: oklch(0.3438 0.0269 95.7226);
        --card: oklch(0.9818 0.0054 95.0986);
        --card-foreground: oklch(0.1908 0.0020 106.5859);
        --popover: oklch(1.0000 0 0);
        --popover-foreground: oklch(0.2671 0.0196 98.9390);
        --primary: oklch(0.6171 0.1375 39.0427);
        --primary-foreground: oklch(1.0000 0 0);
        --secondary: oklch(0.9245 0.0138 92.9892);
        --secondary-foreground: oklch(0.4334 0.0177 98.6048);
        --muted: oklch(0.9341 0.0153 90.2390);
        --muted-foreground: oklch(0.6059 0.0075 97.4233);
        --accent: oklch(0.9245 0.0138 92.9892);
        --accent-foreground: oklch(0.2671 0.0196 98.9390);
        --destructive: oklch(0.1908 0.0020 106.5859);
        --destructive-foreground: oklch(1.0000 0 0);
        --border: oklch(0.8847 0.0069 97.3627);
        --input: oklch(0.7621 0.0156 98.3528);
        --ring: oklch(0.6171 0.1375 39.0427);
        --chart-1: oklch(0.5583 0.1276 42.9956);
        --chart-2: oklch(0.6898 0.1581 290.4107);
        --chart-3: oklch(0.8816 0.0276 93.1280);
        --chart-4: oklch(0.8822 0.0403 298.1792);
        --chart-5: oklch(0.5608 0.1348 42.0584);
        --radius: 0.5rem;
        --shadow-color: oklch(0 0 0);
        --font-mono: JetBrains Mono, ui-monospace, monospace;
      }

      .dark {
        --background: oklch(0.2679 0.0036 106.6427);
        --foreground: oklch(0.8074 0.0142 93.0137);
        --card: oklch(0.2679 0.0036 106.6427);
        --card-foreground: oklch(0.9818 0.0054 95.0986);
        --popover: oklch(0.3085 0.0035 106.6039);
        --popover-foreground: oklch(0.9211 0.0040 106.4781);
        --primary: oklch(0.6724 0.1308 38.7559);
        --primary-foreground: oklch(1.0000 0 0);
        --secondary: oklch(0.9818 0.0054 95.0986);
        --secondary-foreground: oklch(0.3085 0.0035 106.6039);
        --muted: oklch(0.2213 0.0038 106.7070);
        --muted-foreground: oklch(0.7713 0.0169 99.0657);
        --accent: oklch(0.2130 0.0078 95.4245);
        --accent-foreground: oklch(0.9663 0.0080 98.8792);
        --destructive: oklch(0.6368 0.2078 25.3313);
        --destructive-foreground: oklch(1.0000 0 0);
        --border: oklch(0.3618 0.0101 106.8928);
        --input: oklch(0.4336 0.0113 100.2195);
        --ring: oklch(0.6724 0.1308 38.7559);
        --chart-1: oklch(0.5583 0.1276 42.9956);
        --chart-2: oklch(0.6898 0.1581 290.4107);
        --chart-3: oklch(0.2130 0.0078 95.4245);
        --chart-4: oklch(0.3074 0.0516 289.3230);
        --chart-5: oklch(0.5608 0.1348 42.0584);
        --radius: 0.5rem;
        --shadow-color: oklch(0 0 0);
        --font-mono: JetBrains Mono, ui-monospace, monospace;
      }

      /* 语义重命名 + 由 token 派生 (不引入新色值) */
      :root,
      .dark {
        --term-accent: var(--primary);
        --term-border: var(--border);
        --term-border-accent: var(--primary);
        --term-muted: var(--muted-foreground);
        /* dim 是 muted 向背景靠拢的派生值, 保证弱于 muted 又不脱出主题 */
        --term-dim: color-mix(in oklab, var(--muted-foreground) 62%, var(--background));
        --term-panel: var(--popover);
        --term-bg: var(--background);
        --term-danger: var(--destructive);
        --term-selected: var(--accent);
        --term-on-selected: var(--accent-foreground);
        --term-row-h: 20px;
        --term-font-size: 14px;
        --term-cols: 78;
        --term-body-rows: 15;
      }

      /* ---------- 路由: 非活动页面容器隐藏 (SPA 契约) ---------- */
      .tabpage {
        display: none;
        /* 浮层（动作菜单）以此为定位上下文 */
        position: relative;
      }

      .tabpage.is-active {
        display: block;
      }

      /* ---------- 网格与排版 ---------- */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--term-bg);
        color: var(--foreground);
        font-family: var(--font-mono);
        font-size: var(--term-font-size);
        line-height: var(--term-row-h);
        -webkit-font-smoothing: antialiased;
      }

      .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        min-height: 100vh;
        padding: 20px 16px 32px;
        max-width: 100%;
        overflow-x: auto;
      }

      /* ---------- 终端面板: 78 字符定宽网格 ---------- */
      .term {
        width: calc(var(--term-cols) * 1ch);
        max-width: 100%;
        overflow: hidden;
        background: var(--term-panel);
        border-radius: calc(var(--radius) + 2px);
        box-shadow:
          0 1px 2px color-mix(in oklab, var(--shadow-color) 8%, transparent),
          0 8px 24px -12px color-mix(in oklab, var(--shadow-color) 45%, transparent);
      }

      .term.is-narrow {
        --term-cols: 40;
      }

      .row {
        white-space: pre;
        height: var(--term-row-h);
        overflow: hidden;
      }

      /* ---------- 行与列: 左右边框字符连续, 中间内容用 flex 对齐 ---------- */
      .row.lined {
        display: flex;
        align-items: center;
      }

      .bar {
        flex: none;
        color: var(--term-border-accent);
      }

      .content {
        display: flex;
        flex: 1;
        min-width: 0;
        padding: 0 1ch;
        overflow: hidden;
      }

      .content.between {
        justify-content: space-between;
        gap: 2ch;
      }

      .tabs-left {
        display: flex;
        flex: none;
        gap: 1ch;
      }

      .body {
        display: flex;
        flex-direction: column;
        height: calc(var(--term-body-rows) * var(--term-row-h));
        overflow: hidden;
      }

      /* ---------- tab 按钮: 去掉原生外观, 保留键盘可达 ---------- */
      .tab {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }

      .tab.is-active {
        color: var(--term-accent);
        font-weight: 700;
      }

      .tab:focus-visible {
        outline: 2px solid var(--term-accent);
        outline-offset: 1px;
      }

      /* ---------- 语义色: 全部指向 --term-* 映射 ---------- */
      .c-accent {
        color: var(--term-accent);
      }

      .c-muted {
        color: var(--term-muted);
      }

      .c-dim {
        color: var(--term-dim);
      }

      .c-danger {
        color: var(--term-danger);
      }

      .c-bold {
        font-weight: 700;
      }

      /* ---------- 原型控制栏与说明 (不属于 TUI 产物) ---------- */
      .toolbar,
      .hintbar,
      .foot {
        width: calc(var(--term-cols) * 1ch + 2px);
        max-width: 100%;
        box-sizing: border-box;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px 18px;
        padding: 10px 12px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }

      .toolbar-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .tb-btn {
        font-family: inherit;
        font-size: 12px;
        line-height: 1;
        padding: 5px 9px;
        color: var(--foreground);
        background: var(--background);
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) - 2px);
        cursor: pointer;
      }

      .tb-btn:hover {
        background: var(--accent);
        color: var(--accent-foreground);
      }

      .tb-btn.is-active {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--primary-foreground);
      }

      .tb-btn:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 1px;
      }

      .hintbar {
        padding: 8px 12px;
        color: var(--muted-foreground);
        background: var(--card);
        border: 1px dashed var(--border);
        border-radius: calc(var(--radius) - 2px);
        font-size: 12px;
        line-height: 1.7;
      }

      .foot {
        color: var(--muted-foreground);
        font-size: 12px;
        line-height: 1.8;
      }

      .foot strong {
        color: var(--foreground);
        font-weight: 700;
      }

      /* 焦点环: 只在键盘导航时出现, 不抢视觉 */
      .term:focus-visible {
        outline: 2px solid var(--term-accent);
        outline-offset: 2px;
      }

      /* ═══════════════════════════════════════════════════════════════
         页面容器：每个 tab 一个 .pane-row，高度恒为 body 行数
         ═══════════════════════════════════════════════════════════════ */
      .pane-row {
        display: flex;
        height: calc(var(--term-body-rows) * var(--term-row-h));
        overflow: hidden;
      }

      /* 竖边框列：内容由 JS 填成 bodyRows 行 '│'，保证每行都有框 */
      .vbar {
        flex: none;
        width: 1ch;
        white-space: pre;
        color: var(--term-border-accent);
        line-height: var(--term-row-h);
      }

      .cell {
        height: var(--term-row-h);
        white-space: pre;
        overflow: hidden;
      }

      /* 待审分栏：26 + 1 + 49 = 76 = body 内宽（边框另占 2 列） */
      .col-left {
        flex: none;
        width: 26ch;
        padding: 0 1ch;
        overflow: hidden;
      }

      .col-right {
        flex: none;
        width: 49ch;
        padding: 0 1ch;
        overflow: hidden;
      }

      /* 选中行只染单元格背景，边框列保持连续 */
      .cell.is-selected {
        background: var(--term-selected);
        color: var(--term-on-selected);
      }

      .cell.is-selected .c-muted,
      .cell.is-selected .c-dim,
      .cell.is-selected .c-accent {
        color: var(--term-on-selected);
      }

      /* 空态：占满 body 行数，布局不塌 */
      .empty {
        height: calc(var(--term-body-rows) * var(--term-row-h));
        padding: 0 2ch;
        color: var(--term-dim);
        white-space: pre-wrap;
      }

      .empty[hidden] {
        display: none;
      }

      /* 动作菜单浮层：以 .tabpage 为定位上下文 */
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: color-mix(in oklab, var(--term-bg) 72%, transparent);
      }

      .overlay[hidden] {
        display: none;
      }

      .overlay-box {
        padding: 1ch 2ch;
        white-space: pre;
        background: var(--term-panel);
        border: 1px solid var(--term-border);
        border-radius: calc(var(--radius) - 2px);
      }
      /* 单栏页面容器：76ch = body 内宽（左右边框另占 2 列） */
      .col-full {
        flex: none;
        width: 76ch;
        padding: 0 1ch;
        overflow: hidden;
      }

      /* 最近表格：六列 grid，库列吃剩余宽度 */
      .activity-grid {
        display: grid;
        grid-template-columns: 2ch 12ch 8ch minmax(18ch, 1fr) 12ch 8ch;
      }

      .td,
      .th {
        height: var(--term-row-h);
        white-space: pre;
        overflow: hidden;
      }

      .th {
        color: var(--term-dim);
      }

      /* THEMES.md 无 success/warning 语义色：成功复用 muted，警告复用 accent */
      .c-ok {
        color: var(--term-muted);
      }

      .c-warn {
        color: var(--term-accent);
      }
      /* 状态指标卡：4 张并排，各 17ch + 1ch 间隔 = 71ch ≤ 74ch 内宽 */
      .cards {
        display: grid;
        grid-template-columns: repeat(4, 17ch);
        gap: 1ch;
        height: calc(3 * var(--term-row-h));
      }

      .card-line {
        height: var(--term-row-h);
        white-space: pre;
        overflow: hidden;
      }

      /* 原始快照：8 行，超出部分裁掉（现役是整段 JSON 可滚动） */
      .snapshot {
        height: calc(8 * var(--term-row-h));
        overflow: hidden;
      }
      /* 设置列表：13 行可见窗口 + 2 行详解 = 15 行 body */
      .settings-list {
        display: flex;
        flex-direction: column;
        height: calc((var(--term-body-rows) - 2) * var(--term-row-h));
        overflow: hidden;
      }

      .detail {
        height: calc(2 * var(--term-row-h));
        overflow: hidden;
      }

      /* 字段行三列：标签 / 当前值 / 备注 */
      .field-grid {
        display: grid;
        grid-template-columns: 22ch 20ch 1fr;
        gap: 0 1ch;
        align-items: center;
        width: 100%;
      }

      .f-label,
      .f-value,
      .f-note {
        overflow: hidden;
        white-space: nowrap;
      }

      .group-row,
      .field-row {
        padding: 0 1ch;
      }
      /* ═══════════════════════════════════════════════════════════════
         窄终端 40 列：每个 tab 各自降级
         ═══════════════════════════════════════════════════════════════ */
      .term.is-narrow .col-left,
      .term.is-narrow .col-full {
        width: 38ch;
      }

      /* 待审：分栏取消，只留候选列表（详情待落地时内联到选中行下方） */
      .term.is-narrow .col-right {
        display: none;
      }

      .term.is-narrow .pane-row > .vbar:nth-child(3) {
        display: none;
      }

      /* 最近：六列 → 符号 + 动作 + 时间 */
      .term.is-narrow .activity-grid {
        grid-template-columns: 2ch 1fr 10ch;
      }

      .term.is-narrow .activity-grid > :nth-child(6n + 3),
      .term.is-narrow .activity-grid > :nth-child(6n + 4),
      .term.is-narrow .activity-grid > :nth-child(6n + 5) {
        display: none;
      }

      /* 设置：三列 → 标签 + 值，备注列收起 */
      .term.is-narrow .field-grid {
        grid-template-columns: 14ch 1fr;
      }

      .term.is-narrow .f-note {
        display: none;
      }

      /* 状态：卡 4 → 2，sparkline 收起 */
      .term.is-narrow .cards {
        grid-template-columns: repeat(2, 17ch);
      }

      .term.is-narrow #P4-1-C2 {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
</style>
</head>
<body>

<div class="stage">

  <!-- ═══ 工具栏：视图切换 + 全局开关（面板外，非 TUI 内容） ═══ -->
  <div class="toolbar" id="toolbar">
    <div class="toolbar-group" id="views" role="radiogroup" aria-label="状态视图">
      <button type="button" id="empty-toggle" class="tb-btn">空态</button>
    </div>
    <div class="toolbar-group">
      <button type="button" id="P0-1-W1" class="tb-btn" aria-label="切换主题">◐</button>
      <button type="button" id="P0-1-W2" class="tb-btn" aria-label="切换语言">文</button>
      <button type="button" id="ascii-toggle" class="tb-btn" aria-label="切换 ASCII 降级">A</button>
      <button type="button" id="narrow-toggle" class="tb-btn" aria-label="切换 40 列窄终端">40</button>
    </div>
  </div>

  <!-- ═══ TUI 面板本体：78 × 20 字符网格 ═══ -->
  <div class="term" id="P0-1-A1" role="application" aria-label="XpiMemo TUI 面板原型">

    <!-- 顶边框（内嵌双语标题） -->
    <div class="row edge" id="r-top"></div>

    <!-- 标签栏：4 个 tab -->
    <div class="row lined" id="P0-1-C1">
      <span class="bar">│</span>
      <div class="content between">
        <div class="tabs-left">
          <button type="button" id="P0-1-B1" class="tab" data-tab="0">[待审 3]</button>
          <button type="button" id="P0-1-B2" class="tab" data-tab="1">[最近]</button>
          <button type="button" id="P0-1-B3" class="tab" data-tab="2">[设置]</button>
          <button type="button" id="P0-1-B4" class="tab" data-tab="3">[状态]</button>
        </div>
        <!-- 现役 console.ts 的 tab 栏右侧无内容，此处不再预留占位 -->
      </div>
      <span class="bar">│</span>
    </div>

    <!-- body：4 个页面容器，非活动项 display:none -->
    <div class="body" id="r-body">

      <!-- ─── P1 待审 ─── -->
      <div class="tabpage" id="page-pending" data-page="pending" data-route="#/pending">
        <div class="pane-row" id="pending-pane">
          <div class="vbar" aria-hidden="true"></div>
          <div class="col-left" id="P1-1-L1" role="listbox" aria-label="候选列表"></div>
          <div class="vbar" aria-hidden="true"></div>
          <div class="col-right" id="P1-1-A1" role="region" aria-label="候选详情"></div>
          <div class="vbar" aria-hidden="true"></div>
        </div>
        <div class="empty" id="P1-1-T1" hidden></div>
        <div class="overlay" id="P1-1-M1" hidden role="dialog" aria-label="候选动作菜单">
          <div class="overlay-box" id="pending-menu-box"></div>
        </div>
      </div>

      <!-- ─── P2 最近 ─── -->
      <div class="tabpage" id="page-recent" data-page="recent" data-route="#/recent">
        <div class="pane-row" id="recent-pane">
          <div class="vbar" aria-hidden="true"></div>
          <div class="col-full" id="P2-1-X1" role="table" aria-label="最近活动"></div>
          <div class="vbar" aria-hidden="true"></div>
        </div>
        <div class="empty" id="P2-1-T1" hidden></div>
      </div>

      <!-- ─── P3 设置 ─── -->
      <div class="tabpage" id="page-settings" data-page="settings" data-route="#/settings">
        <div class="pane-row" id="settings-pane">
          <div class="vbar" aria-hidden="true"></div>
          <div class="col-full">
            <!-- 25 行元素全部静态存在（id = 字典短码），显隐与内容由 renderSettings() 控制。
                 折叠用 hidden 而不是删除 DOM，annotate 注入的徽标因此保留。 -->
            <div class="settings-list" id="P3-1-L1" role="listbox" aria-label="设置字段">
              <div class="cell group-row" id="P3-1-B1" data-group="retrieval"></div>
              <div class="cell field-row" id="P3-1-S1" data-field="recallPolicy"></div>
              <div class="cell field-row" id="P3-1-S2" data-field="retrievalMode"></div>
              <div class="cell field-row" id="P3-1-S3" data-field="searchBackend"></div>
              <div class="cell field-row" id="P3-1-S4" data-field="limit"></div>
              <div class="cell field-row" id="P3-1-S5" data-field="globalLimit"></div>
              <div class="cell field-row" id="P3-1-S6" data-field="projectLimit"></div>
              <div class="cell group-row" id="P3-1-B2" data-group="storage"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   ASCII 降级符号层
   语义移植自 termcn registry/bases/ink/lib/terminal-symbols.ts 的
   toAsciiComponentText / resolveStatusSymbol。只移植映射表与判定，
   不引其 React/Ink 运行时（与本原型的 pi-tui 命令式渲染不兼容）。
   ═══════════════════════════════════════════════════════════════════ */
var ASCII_MAP = {
  /* 边框与线条 */
  "╭": "+", "╮": "+", "╰": "+", "╯": "+",
  "┌": "+", "┐": "+", "└": "+", "┘": "+",
  "├": "+", "┤": "+", "┬": "+", "┴": "+", "┼": "+",
  "─": "-", "━": "-", "═": "=",
  "│": "|", "┃": "|", "║": "|",
  "╔": "+", "╗": "+", "╚": "+", "╝": "+",
  "╠": "+", "╣": "+", "╦": "+", "╩": "+", "╬": "+",
  /* 折叠与箭头 */
  "▸": ">", "▾": "v", "◂": "<", "◃": "<",
  "←": "<", "→": ">", "↑": "^", "↓": "v", "↔": "<->",
  /* 状态符号 (resolveStatusSymbol 的六态) */
  "✓": "v", "✗": "x", "⚠": "!", "ℹ": "i",
  "●": "*", "○": "o", "·": "-", "◉": "*",
  "◆": "*", "◇": "o", "■": "#", "□": "[ ]", "▪": "*",
  /* 块元素 */
  "█": "#", "▉": "#", "▊": "#", "▋": "#",
  "▌": "#", "▍": "#", "▎": "#", "▏": "#",
  "░": ".", "▒": "+", "▓": "#",
  /* 字符画柱: 八级在 ASCII 里没有可读替身, 统一退化为 # */
  "▁": "_", "▂": "=", "▃": "+", "▄": "*",
  "▅": "#", "▆": "#", "▇": "#",
  /* 编辑与动作 */
  "↵": "<", "✎": "e", "⊘": "x", "⏳": "~", "⏭": ">>"
};

/** 把组件字符替换成 ASCII 替身；表外字符（含中文正文）原样保留。 */
function toAscii(value) {
  var out = "";
  for (var i = 0; i < value.length; i++) {
    var ch = value.charAt(i);
    out += ASCII_MAP[ch] || ch;
  }
  return out;
}

/* ═══════════════════════════════════════════════════════════════════
   原型状态
   ═══════════════════════════════════════════════════════════════════ */
var proto = {
  asciiMode: "auto",
  ascii: false,
  cols: 78,
  bodyRows: 15
};

/** 40 列窄终端开关；打开时 .term 加 is-narrow，边框宽度随之切换。 */
var narrow = false;

/* auto 检测的输入。原型读不到 process.env，所以用可切换的模拟值；
   落地时改为读 process.env.LC_ALL / LANG / TERM。
   LC_ALL 清空即模拟一个非 UTF-8 的 SSH 会话，用于演示 auto 分支。 */
window.__env = {
  LANG: "en_US.UTF-8",
  LC_ALL: "",
  TERM: "xterm-256color"
};

/** auto：locale 非 UTF-8 则降级；无 locale 时看 TERM 是否 dumb。 */
function detectAscii() {
  var env = window.__env || {};
  var locale = env.LC_ALL || env.LANG || "";
  if (locale) return !/utf-?8/i.test(locale);
  var term = env.TERM || "";
  return term === "" || term === "dumb";
}

function resolveAscii() {
  if (proto.asciiMode === "always") return true;
  if (proto.asciiMode === "never") return false;
  return detectAscii();
}

/** 所有组件字符的唯一出口：ASCII 模式开着就降级，否则原样。 */
function sym(value) {
  return proto.ascii ? toAscii(value) : value;
}

/* ═══════════════════════════════════════════════════════════════════
   边框（2.5 会在这里加内嵌标题）
   ═══════════════════════════════════════════════════════════════════ */
function edgeRow(left, right, cols) {
  return sym(left) + sym("─").repeat(cols - 2) + sym(right);
}

function renderFrame() {
  var cols = narrow ? 40 : proto.cols;
  document.getElementById("r-top").textContent = titleBorder(cols);
  document.getElementById("r-bottom").textContent = edgeRow("╰", "╯", cols);
}

/* ═══════════════════════════════════════════════════════════════════
   ASCII 开关：auto → always → never 循环
   ═══════════════════════════════════════════════════════════════════ */
var ASCII_ORDER = ["auto", "always", "never"];

function applyAscii() {
  proto.ascii = resolveAscii();
  var btn = document.getElementById("ascii-toggle");
  btn.textContent = "A:" + proto.asciiMode;
  btn.classList.toggle("is-active", proto.ascii);
  btn.setAttribute("aria-label", "ASCII 降级模式 " + proto.asciiMode);
  btn.title =
    "ASCII 降级：" +
    proto.asciiMode +
    (proto.ascii ? "（已降级）" : "（保留 Unicode）") +
    " — 点击循环 auto → always → never";
}

document.getElementById("ascii-toggle").addEventListener("click", function () {
  var next = (ASCII_ORDER.indexOf(proto.asciiMode) + 1) % ASCII_ORDER.length;
  proto.asciiMode = ASCII_ORDER[next];
  applyAscii();
  renderFrame();
  renderChrome();
});

document.getElementById("narrow-toggle").addEventListener("click", function () {
  narrow = !narrow;
  document.getElementById("P0-1-A1").classList.toggle("is-narrow", narrow);
  document.getElementById("narrow-toggle").classList.toggle("is-active", narrow);
  renderFrame();
});

/* ═══════════════════════════════════════════════════════════════════
   hash 路由：非活动页面容器 display:none（SPA 契约）
   ═══════════════════════════════════════════════════════════════════ */
(function () {
  var pages = Array.prototype.slice.call(document.querySelectorAll(".tabpage"));
  var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));

  function routeFromHash() {
    var hash = location.hash || "#/pending";
    for (var i = 0; i < pages.length; i++) {
      if (pages[i].dataset.route === hash) return pages[i];
    }
    return pages[0];
  }

  function applyRoute() {
    var target = routeFromHash();
    pages.forEach(function (page) {
      var active = page === target;
      page.classList.toggle("is-active", active);
      if (!active) page.setAttribute("hidden", "");
      else page.removeAttribute("hidden");
    });
    var index = String(pages.indexOf(target));
    tabs.forEach(function (tab) {
      tab.classList.toggle("is-active", tab.dataset.tab === index);
    });
  }

  window.addEventListener("hashchange", applyRoute);
  applyRoute();
})();

/* ═══════════════════════════════════════════════════════════════════
   CJK 宽度：中文与全角标点占 2 列，与 pi-tui 的 visibleWidth 同口径。
   边框填充必须用它算，否则中文标题会把右边角挤出列。
   ═══════════════════════════════════════════════════════════════════ */
function charWidth(ch) {
  var c = ch.codePointAt(0);
  if (
    (c >= 0x1100 && c <= 0x115f) ||
    c === 0x2329 ||
    c === 0x232a ||
    (c >= 0x2e80 && c <= 0xa4cf && c !== 0x303f) ||
    (c >= 0xac00 && c <= 0xd7a3) ||
    (c >= 0xf900 && c <= 0xfaff) ||
    (c >= 0xfe30 && c <= 0xfe6f) ||
    (c >= 0xff00 && c <= 0xff60) ||
    (c >= 0xffe0 && c <= 0xffe6)
  ) {
    return 2;
  }
  return 1;
}

function visibleWidth(value) {
  var width = 0;
  for (var i = 0; i < value.length; i++) width += charWidth(value.charAt(i));
  return width;
}

/* ═══════════════════════════════════════════════════════════════════
   chrome 渲染
   ═══════════════════════════════════════════════════════════════════ */
/** 产品标题，双语并排内嵌顶边框 —— 标题因此不额外消耗 body 行。 */
var PANEL_TITLE = "xpi-memo · pi 的 DNA 记忆体 / pi's DNA memory";

function titleBorder(cols) {
  var inner = cols - 2;
  var label = sym("─ " + PANEL_TITLE + " ");
  var fill = inner - visibleWidth(label);
  if (fill < 0) return sym("╭") + sym("─").repeat(inner) + sym("╮");
  return sym("╭") + label + sym("─").repeat(fill) + sym("╮");
}

function renderTabs() {
  var keys = ["pending", "recent", "settings", "status"];
  var buttons = document.querySelectorAll(".tab");
  for (var i = 0; i < buttons.length; i++) {

/* ═══════════════════════════════════════════════════════════════════
   P1 待审：左右分栏
   左栏 26 列放候选，右栏 49 列放详情；↑/↓ 换候选，Enter 开动作菜单。
   ═══════════════════════════════════════════════════════════════════ */
var PENDING = [
  {
    kind: "记忆",
    bank: "xpi-memo",
    age: "2h",
    conflict: true,
    evidence: "用户原话",
    rationale: "用户明确陈述为长期偏好",

  },

    bank: "global",

    conflict: false,
    evidence: "会话重复出现",

  },
  {

    rationale: "提交前必须全绿",
    content: "typecheck / lint / test 三条全绿才算完成"
  }
];

var pendingCursor = 0;

/** 转义后再拼进 innerHTML —— 原型数据是常量，但拼接路径不留裸注入。 */
function esc(value) {
  return String(value).replace(/[&<>"']/g, function (ch) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '\"': "&quot;", "'": "&#39;" }[ch];
  });
}

/** 竖边框列：填成 bodyRows 行 '│'，分栏两侧每行都有框。 */
function renderVbars() {
  var lines = [];
  for (var i = 0; i < proto.bodyRows; i++) lines.push("│");
  var value = sym(lines.join("\n"));
  var bars = document.querySelectorAll(".vbar");
  for (var j = 0; j < bars.length; j++) bars[j].textContent = value;
}

function renderPending() {
  var list = document.getElementById("P1-1-L1");
  var detail = document.getElementById("P1-1-A1");
  var empty = document.getElementById("P1-1-T1");
  var pane = document.getElementById("pending-pane");

  if (PENDING.length === 0) {
    pane.hidden = true;
    empty.hidden = false;
    empty.textContent = sym(t("pending.empty"));
    return;
  }
  pane.hidden = false;
  empty.hidden = true;

  list.innerHTML = PENDING.map(function (item, index) {
    var selected = index === pendingCursor;
    var text =
      (selected ? "▸ " : "  ") +
      item.kind +
      " · " +
      item.age +
      (item.conflict ? " ⚠" : "");
    return (
      '<div class="cell' + (selected ? " is-selected" : "") + '">' +
      esc(sym(text)) +
      "</div>"
    );
  }).join("");

  var cur = PENDING[pendingCursor];
  var rows = [
    ["pending.type", cur.kind],
    ["pending.bank", cur.bank],
    ["pending.age", cur.age + " " + t("pending.ago")],
    ["pending.evidence", cur.evidence],
    ["pending.rationale", cur.rationale],
    ["pending.content", cur.content]
  ];
  detail.innerHTML = rows.map(function (row) {
    return (
      '<div class="cell"><span class="c-muted">' +
      esc(sym(t(row[0]) + ": ")) +
      "</span>" +
      esc(sym(row[1])) +
      "</div>"
    );
  }).join("");
}

function renderPendingMenu() {
  var box = document.getElementById("pending-menu-box");
  box.textContent = sym(
    ["pending.store", "pending.reject", "pending.later"]
      .map(function (key, index) {
        return (index === 0 ? "▸ " : "  ") + t(key);
      })
      .join("\n")
  );
}

function pendingMove(step) {
  if (PENDING.length === 0) return;
  pendingCursor = (pendingCursor + step + PENDING.length) % PENDING.length;
  renderPending();
}

function pendingMenuOpen() {
  return document.getElementById("P1-1-M1").hidden === false;
}

function openPendingMenu() {
  if (PENDING.length === 0) return;
  renderPendingMenu();
  document.getElementById("P1-1-M1").hidden = false;
}

function closePendingMenu() {
  document.getElementById("P1-1-M1").hidden = true;
}

/** 键盘只在待审页生效；其他页的键位留给各自的任务处理。 */
function bindKeys() {
  document.addEventListener("keydown", function (event) {
    var page = document.querySelector(".tabpage.is-active");
    if (!page) return;
    var name = page.dataset.page;
    if (name === "pending") {
      if (event.key === "ArrowUp") {
        event.preventDefault();
        pendingMove(-1);
      } else if (event.key === "ArrowDown") {
        event.preventDefault();
        pendingMove(1);
      } else if (event.key === "Enter") {
        event.preventDefault();
        if (pendingMenuOpen()) closePendingMenu();
        else openPendingMenu();
      } else if (event.key === "Escape" && pendingMenuOpen()) {
        event.preventDefault();
        closePendingMenu();
      }
      return;
    }
    if (name === "settings") {
      if (event.key === "ArrowUp") {
        event.preventDefault();
        settingsMove(-1);
      } else if (event.key === "ArrowDown") {
        event.preventDefault();
        settingsMove(1);
      } else if (event.key === "Tab") {
        event.preventDefault();
        settingsMoveField(event.shiftKey ? -1 : 1);
      } else if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        settingsActivate();
      }
    }
  });
}

/* ═══════════════════════════════════════════════════════════════════

   现役是 JSON.stringify 后逐行 dump；这里把数字提到指标卡，
   原始 JSON 降为次要信息保留在下方。
   ═══════════════════════════════════════════════════════════════════ */

  '"consistency": { "memoryProjection": "complete" },',
  '"doctor": null'
];

var BAR_WIDTH = 20;
var SPARK_LEVELS = "▁▂▃▄▅▆▇█";

/** 占用条：filled 个实心 + 剩余空心；ASCII 下由 sym() 换成 # 与 . */
function usageBar(value, max) {
  var filled = max > 0 ? Math.round((value / max) * BAR_WIDTH) : 0;
  filled = Math.max(0, Math.min(BAR_WIDTH, filled));
  return "█".repeat(filled) + "░".repeat(BAR_WIDTH - filled);
}

/**
 * 八级字符画。ASCII 模式下八级柱没有可读替身，退化成 # 计数条
 * —— 每个值归一化到 1–8 后按长度重复。
 */
function sparkline(values) {
  var max = Math.max.apply(null, values);
  if (proto.ascii) {
    var peak = max > 0 ? max : 1;
    return values
      .map(function (v) {
        return "#".repeat(Math.max(1, Math.round((v / peak) * 8)));
      })
      .join(" ");
  }
  return values
    .map(function (v) {
      var index = max > 0 ? Math.round((v / max) * (SPARK_LEVELS.length - 1)) : 0;
      return SPARK_LEVELS.charAt(index);
    })
    .join("");
}

/** 一张指标卡的三行：顶边框带标题、值行、底边框，总宽 17 列。 */
function cardLines(title, value) {
  var w = 17;
  var label = "─ " + title + " ";
  var topFill = Math.max(w - 2 - visibleWidth(label), 0);
  var midFill = Math.max(w - 4 - visibleWidth(value), 0);
  return [
    sym("┌") + sym(label) + sym("─").repeat(topFill) + sym("┐"),
    sym("│") + " " + value + " ".repeat(midFill) + " " + sym("│"),
    sym("└") + sym("─").repeat(w - 2) + sym("┘")
  ];
}

function renderStatus() {
  document.getElementById("P4-1-A1").innerHTML = STATUS_CARDS.map(function (item) {
    return (
      '<div class="card">' +
      cardLines(t(item.key), item.value)
        .map(function (line) {
          return '<div class="card-line">' + esc(line) + "</div>";
        })
        .join("") +
      "</div>"
    );
  }).join("");

  var today = STATUS_DAILY[STATUS_DAILY.length - 1];
  var peak = Math.max.apply(null, STATUS_DAILY);
  var percent = peak > 0 ? Math.round((today / peak) * 100) : 0;
  document.getElementById("P4-1-C1").textContent = sym(
    t("status.usage") + "  " + usageBar(today, peak) + "  " + percent + "%"
  );

  document.getElementById("P4-1-C2").textContent = sym(
    t("status.trend") + "  " + sparkline(STATUS_DAILY)
  );

  document.getElementById("status-recall").textContent = sym(t("status.recall"));

  document.getElementById("status-snapshot-title").textContent = sym(
    "── " + t("status.snapshot") + " ──"
  );

  document.getElementById("P4-1-A2").innerHTML = STATUS_JSON.map(function (line) {
    return '<div class="cell">' + esc(sym(line)) + "</div>";
  }).join("");
}

  paused: "P3-1-S12",
  l0Enabled: "P3-1-S13",
  profileInjection: "P3-1-S14",
  language: "P3-1-S15",
  eventPresentation: "P3-1-S16",
  passiveFeedback: "P3-1-S17",
  privacy: "P3-1-S18",
  sleepMode: "P3-1-S19",
  sleep: "P3-1-S20"
};

/* 默认只展开首组：78×20 下 body 只有 13 行列表位，装不下 5 组 20 字段。 */
var collapsed = { storage: true, pipeline: true, display: true, privacy: true };
var envLocked = {};
var settingsCursor = 0;
var settingsStart = 0;
var LIST_ROWS = proto.bodyRows - 2;

/** 当前语言在字段数据里的键（console.ts 用 zh，这里与 i18n 表统一成 zh-CN）。 */
function langKey() {
  return lang === "en" ? "en" : "zh";
}

/** 按当前折叠态展平：组头 + 未折叠组内的字段。 */
function flatRows() {
  var out = [];
  GROUPS.forEach(function (group) {
    out.push({ type: "group", group: group });
    if (!collapsed[group.id]) {
      group.fields.forEach(function (field) {
        out.push({ type: "field", group: group, field: field });
      });
    }
  });
  return out;
}

/** 滚动窗口：光标始终留在可见区，窗口不越界。 */
function windowStart(cursor, total) {
  var start = settingsStart;
  if (cursor < start) start = cursor;
  if (cursor >= start + LIST_ROWS) start = cursor - LIST_ROWS + 1;
  return Math.max(0, Math.min(start, Math.max(total - LIST_ROWS, 0)));
}

function groupLabel(group) {
  return group[langKey()] || group.zh;
}

function fieldCopy(field) {
  return field[langKey()] || field.zh;
}

function fillGroupRow(el, group) {
  var arrow = collapsed[group.id] ? "▸" : "▾";
  el.innerHTML =
    '<span class="c-accent">' +
    esc(sym(arrow)) +
    "</span> " +
    '<span class="c-bold">' +
    esc(sym(groupLabel(group))) +
    "</span> " +
    '<span class="c-dim">(' +
    group.fields.length +
    ")</span>";
}

function fillFieldRow(el, field) {
  var copy = fieldCopy(field);
  var locked = Boolean(field.env && envLocked[field.key]);
  var labelCls = "f-label " + (locked ? "c-dim" : "c-muted");
  var valueCls =
    "f-value " + (field.action ? "c-accent" : field.readOnly ? "c-muted" : "c-bold");
  var note = locked ? "⊘ " + field.env : copy.note;
  el.innerHTML =
    '<div class="field-grid">' +
    '<span class="' +
    labelCls +
    '">' +
    esc(sym(copy.label)) +
    "</span>" +
    '<span class="' +
    valueCls +
    '">' +
    esc(sym(field.action ? "↵ " + field.value : field.value)) +
    "</span>" +
    '<span class="f-note c-dim">' +
    esc(sym(note)) +
    "</span>" +
    "</div>";
}

function renderSettings() {
  var rows = flatRows();
  settingsCursor = Math.max(0, Math.min(settingsCursor, rows.length - 1));
  settingsStart = windowStart(settingsCursor, rows.length);

  // 全部隐藏，只有窗口内的行显示。折叠同样用 hidden，DOM 不删。
  GROUPS.forEach(function (group) {
    document.getElementById(GROUP_SHORT[group.id]).hidden = true;
    group.fields.forEach(function (field) {
      document.getElementById(FIELD_SHORT[field.key]).hidden = true;
    });
  });

  rows.slice(settingsStart, settingsStart + LIST_ROWS).forEach(function (row, i) {
    var el = document.getElementById(
      row.type === "group" ? GROUP_SHORT[row.group.id] : FIELD_SHORT[row.field.key]
    );
    el.hidden = false;
    el.classList.toggle("is-selected", settingsStart + i === settingsCursor);
    if (row.type === "group") fillGroupRow(el, row.group);
    else fillFieldRow(el, row.field);
  });

  renderSettingsDetail();
}

/** 详解区恒两行：组头行留空，几何不随光标变化。 */
function renderSettingsDetail() {
  var row = flatRows()[settingsCursor];
  var line1 = document.getElementById("detail-1");
  var line2 = document.getElementById("detail-2");
  if (!row || row.type === "group") {
    line1.textContent = "";
    line2.textContent = "";
    return;
  }
  var copy = fieldCopy(row.field);
  line1.textContent = sym(copy.detail);
  line2.textContent = sym(copy.choice);
}

function settingsToggleGroup(id) {
  collapsed[id] = !collapsed[id];
  renderSettings();
}

function settingsMove(step) {
  var rows = flatRows();
  settingsCursor = (settingsCursor + step + rows.length) % rows.length;
  renderSettings();
}

/** Tab 只在字段行之间跳，跳过组头。 */
function settingsMoveField(step) {
  var rows = flatRows();
  var index = settingsCursor;
  for (var i = 0; i < rows.length; i++) {
    index = (index + step + rows.length) % rows.length;
    if (rows[index].type === "field") break;
  }
  settingsCursor = index;
  renderSettings();
}

/** Enter 在组头折叠展开；字段行本轮不改值（值切换留待落地）。 */
function settingsActivate() {
  var row = flatRows()[settingsCursor];
  if (row && row.type === "group") settingsToggleGroup(row.group.id);
}

/* ═══════════════════════════════════════════════════════════════════
   偏好持久化 + 全局接线
   位置必须在 PENDING / RECENT / GROUPS 之后：接线里要读它们的快照。
   ═══════════════════════════════════════════════════════════════════ */
var PREFS_KEY = "xpi-memo-proto";

function loadPrefs() {
  try {
    return JSON.parse(localStorage.getItem(PREFS_KEY) || "{}");
  } catch (e) {
    return {};
  }
}

function savePrefs() {
  try {
    localStorage.setItem(
      PREFS_KEY,
      JSON.stringify({
        theme: document.documentElement.classList.contains("dark") ? "dark" : "light",
        lang: lang,
        asciiMode: proto.asciiMode,
        narrow: narrow
      })
    );
  } catch (e) {
    /* 存不进去不影响当前会话 */
  }
}

/** 语言、主题、ASCII、窄屏任一变化后重画全部区域。 */
function renderAll() {
  renderFrame();
  renderChrome();
  renderVbars();
  renderPending();
  renderRecent();
  renderStatus();
  renderSettings();
}

function applyChromeState() {
  document.getElementById("P0-1-W1").textContent =
    document.documentElement.classList.contains("dark") ? "◐" : "◑";
  document.getElementById("P0-1-W2").textContent = lang === "zh-CN" ? "文" : "EN";
  document.getElementById("P0-1-A1").classList.toggle("is-narrow", narrow);
  document.getElementById("narrow-toggle").classList.toggle("is-active", narrow);
}

document.getElementById("P0-1-W1").addEventListener("click", function () {
  document.documentElement.classList.toggle("dark");
  applyChromeState();
  savePrefs();
});

document.getElementById("P0-1-W2").addEventListener("click", function () {
  lang = lang === "zh-CN" ? "en" : "zh-CN";
  document.documentElement.lang = lang;
  applyChromeState();
  renderAll();
  savePrefs();
});

/* 空态：清空演示数据再恢复，用来检查各 tab 的空视图。 */
var PENDING_FULL = PENDING.slice();
var RECENT_FULL = RECENT.slice();
var emptyMode = false;

document.getElementById("empty-toggle").addEventListener("click", function () {
  emptyMode = !emptyMode;
  PENDING.length = 0;
  RECENT.length = 0;
  if (!emptyMode) {
    PENDING.push.apply(PENDING, PENDING_FULL);
    RECENT.push.apply(RECENT, RECENT_FULL);
  }
  document.getElementById("empty-toggle").classList.toggle("is-active", emptyMode);
  renderPending();
  renderRecent();
});

/* tab 按钮只改 hash，路由由 hashchange 统一处理。 */
Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (button) {
  button.addEventListener("click", function () {
    var pages = document.querySelectorAll(".tabpage");
    var page = pages[Number(button.dataset.tab)];
    if (page) location.hash = page.dataset.route;
  });
});
/* ═══ 启动：先读偏好，再一次性画全 ═══ */
(function boot() {
  var prefs = loadPrefs();
  if (prefs.lang === "en" || prefs.lang === "zh-CN") lang = prefs.lang;
  if (prefs.asciiMode) proto.asciiMode = prefs.asciiMode;
  if (prefs.narrow) narrow = true;
  document.documentElement.lang = lang;
  applyAscii();
  applyChromeState();
  renderAll();
  bindKeys();
})();
</script>

</body>
</html>
