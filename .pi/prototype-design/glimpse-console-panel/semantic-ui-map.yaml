# semantic-ui-map — glimpse-console-panel
#
# 双码分工：短码 P1-2-B1 给人念，全路径 shell.header 给机器认。
# 本文件跨保真度共享：同一元素在 wireframe 与 hifi 阶段的 id / short 不变，
# 只有 fidelities 各指一处。字段说明见 docs/semantic-ui-map-schema.md。
#
# 本项目是 TUI 版（tui-console-panel）的像素媒介对照版：
# 信息架构继承，媒介与布局独立。元素 id 与 TUI 版刻意不同名，
# 避免两套原型在口语引用上互相混淆。
