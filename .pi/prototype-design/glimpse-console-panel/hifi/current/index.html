<!DOCTYPE html>
<html class="dark" lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XpiMemo T1 Console — Glimpse 面板原型</title>
<script>
/* 首帧前应用主题与语言，避免闪烁。只改 DOM；语言变量由主脚本启动时读回。 */
(function () {
  try {
    var prefs = JSON.parse(localStorage.getItem("xpi-memo-glimpse-proto") || "{}");
    if (prefs.theme === "light") document.documentElement.classList.remove("dark");
    if (prefs.lang === "en") document.documentElement.lang = "en";
  } catch (e) {
    /* localStorage 不可用（隐私模式等）时静默回落默认值 */
  }
})();
</script>
<style>
      /* ═══════════════════════════════════════════════════════════════
         Design tokens — 数值逐字取自 <项目根>/THEMES.md (shadcn oklch)。
         本文件不新增色值；下面的派生变量只做语义重命名或 calc，不改数值。
         ═══════════════════════════════════════════════════════════════ */
      :root {
        --background: oklch(0.9818 0.0054 95.0986);
        --foreground: oklch(0.3438 0.0269 95.7226);
        --card: oklch(0.9818 0.0054 95.0986);
        --card-foreground: oklch(0.1908 0.0020 106.5859);
        --popover: oklch(1.0000 0 0);
        --popover-foreground: oklch(0.2671 0.0196 98.9390);
        --primary: oklch(0.6171 0.1375 39.0427);
        --primary-foreground: oklch(1.0000 0 0);
        --secondary: oklch(0.9245 0.0138 92.9892);
        --secondary-foreground: oklch(0.4334 0.0177 98.6048);
        --muted: oklch(0.9341 0.0153 90.2390);
        --muted-foreground: oklch(0.6059 0.0075 97.4233);
        --accent: oklch(0.9245 0.0138 92.9892);
        --accent-foreground: oklch(0.2671 0.0196 98.9390);
        --destructive: oklch(0.1908 0.0020 106.5859);
        --destructive-foreground: oklch(1.0000 0 0);
        --border: oklch(0.8847 0.0069 97.3627);
        --input: oklch(0.7621 0.0156 98.3528);
        --ring: oklch(0.6171 0.1375 39.0427);
        --chart-1: oklch(0.5583 0.1276 42.9956);
        --chart-2: oklch(0.6898 0.1581 290.4107);
        --chart-3: oklch(0.8816 0.0276 93.1280);
        --chart-4: oklch(0.8822 0.0403 298.1792);
        --chart-5: oklch(0.5608 0.1348 42.0584);
        --sidebar: oklch(0.9663 0.0080 98.8792);
        --sidebar-foreground: oklch(0.3590 0.0051 106.6524);
        --sidebar-primary: oklch(0.6171 0.1375 39.0427);
        --sidebar-primary-foreground: oklch(0.9881 0 0);
        --sidebar-accent: oklch(0.9245 0.0138 92.9892);
        --sidebar-accent-foreground: oklch(0.3250 0 0);
        --sidebar-border: oklch(0.9401 0 0);
        --sidebar-ring: oklch(0.7731 0 0);
        --font-sans: Inter, ui-sans-serif, sans-serif, system-ui;
        --font-serif: Noto Serif, ui-serif, serif;
        --font-mono: JetBrains Mono, ui-monospace, monospace;
        --radius: 0.5rem;
        --shadow-color: oklch(0 0 0);
        --shadow-sm: 0 1px 3px 0px hsl(0 0% 0% / 0.10), 0 1px 2px -1px hsl(0 0% 0% / 0.10);
        --shadow-md: 0 1px 3px 0px hsl(0 0% 0% / 0.10), 0 2px 4px -1px hsl(0 0% 0% / 0.10);
        --shadow-lg: 0 1px 3px 0px hsl(0 0% 0% / 0.10), 0 4px 6px -1px hsl(0 0% 0% / 0.10);
      }

      .dark {
        --background: oklch(0.2679 0.0036 106.6427);
        --foreground: oklch(0.8074 0.0142 93.0137);
        --card: oklch(0.2679 0.0036 106.6427);
        --card-foreground: oklch(0.9818 0.0054 95.0986);
        --popover: oklch(0.3085 0.0035 106.6039);
        --popover-foreground: oklch(0.9211 0.0040 106.4781);
        --primary: oklch(0.6724 0.1308 38.7559);
        --primary-foreground: oklch(1.0000 0 0);
        --secondary: oklch(0.9818 0.0054 95.0986);
        --secondary-foreground: oklch(0.3085 0.0035 106.6039);
        --muted: oklch(0.2213 0.0038 106.7070);
        --muted-foreground: oklch(0.7713 0.0169 99.0657);
        --accent: oklch(0.2130 0.0078 95.4245);
        --accent-foreground: oklch(0.9663 0.0080 98.8792);
        --destructive: oklch(0.6368 0.2078 25.3313);
        --destructive-foreground: oklch(1.0000 0 0);
        --border: oklch(0.3618 0.0101 106.8928);
        --input: oklch(0.4336 0.0113 100.2195);
        --ring: oklch(0.6724 0.1308 38.7559);
        --chart-1: oklch(0.5583 0.1276 42.9956);
        --chart-2: oklch(0.6898 0.1581 290.4107);
        --chart-3: oklch(0.2130 0.0078 95.4245);
        --chart-4: oklch(0.3074 0.0516 289.3230);
        --chart-5: oklch(0.5608 0.1348 42.0584);
        --sidebar: oklch(0.2357 0.0024 67.7077);
        --sidebar-foreground: oklch(0.8074 0.0142 93.0137);
        --sidebar-primary: oklch(0.3250 0 0);
        --sidebar-primary-foreground: oklch(0.9881 0 0);
        --sidebar-accent: oklch(0.1680 0.0020 106.6177);
        --sidebar-accent-foreground: oklch(0.8074 0.0142 93.0137);
        --sidebar-border: oklch(0.9401 0 0);
        --sidebar-ring: oklch(0.7731 0 0);
        --font-sans: Inter, ui-sans-serif, sans-serif, system-ui;
        --font-serif: Noto Serif, ui-serif, serif;
        --font-mono: JetBrains Mono, ui-monospace, monospace;
        --radius: 0.5rem;
        --shadow-color: oklch(0 0 0);
        --shadow-sm: 0 1px 3px 0px hsl(0 0% 0% / 0.10), 0 1px 2px -1px hsl(0 0% 0% / 0.10);
        --shadow-md: 0 1px 3px 0px hsl(0 0% 0% / 0.10), 0 2px 4px -1px hsl(0 0% 0% / 0.10);
        --shadow-lg: 0 1px 3px 0px hsl(0 0% 0% / 0.10), 0 4px 6px -1px hsl(0 0% 0% / 0.10);
      }

      /* ═══════════════════════════════════════════════════════════════
         几何与刻度：窗口固定 800×600（TUI-DESIGN.md §1 的尺寸契约）。
         纵向 56 + 500 + 44 = 600；横向 180 + 620 = 800。
         间距走 8pt 节奏；圆角由 --radius 派生，与 shadcn 一致。
         ═══════════════════════════════════════════════════════════════ */
      :root {
        --win-w: 800px;
        --win-h: 600px;
        --h-header: 56px;
        --h-body: 500px;
        --h-footer: 44px;
        --w-sidebar: 180px;
        --w-content: 620px;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-6: 24px;
        --space-8: 32px;
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
      }

      /* ---------- reset ---------- */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      /* hidden 属性必须能盖住显式 display（.pane-split / .table-wrap 都是 flex）。
         UA 的 [hidden]{display:none} 与类选择器同权重，作者样式在后就会赢。 */
      [hidden] {
        display: none !important;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--background);
        color: var(--foreground);
        font-family: var(--font-sans);
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      button {
        font: inherit;
        color: inherit;
      }

      /* ---------- 路由：非活动页面容器隐藏（SPA 契约） ---------- */
      .tabpage {
        display: none;
      }

      .tabpage.is-active {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      /* ═══════════════════════════════════════════════════════════════
         窗口外壳：固定 800×600，三段纵向布局
         ═══════════════════════════════════════════════════════════════ */
      .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-4);
        min-height: 100vh;
        padding: var(--space-8) var(--space-4);
      }

      .window {
        flex: none;
        display: flex;
        flex-direction: column;
        width: var(--win-w);
        height: var(--win-h);
        overflow: hidden;
        background: var(--card);
        color: var(--card-foreground);
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-lg);
      }

      .app-body {
        display: flex;
        flex: none;
        height: var(--h-body);
        overflow: hidden;
      }

      .app-content {
        flex: none;
        width: var(--w-content);
        height: var(--h-body);
        padding: var(--space-6);
        overflow: hidden;
      }

      /* ═══════════════════════════════════════════════════════════════
         基础组件：btn / badge / pill / card（shadcn 外观）
         ═══════════════════════════════════════════════════════════════ */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        height: 32px;
        padding: 0 var(--space-4);
        border: 1px solid transparent;
        border-radius: var(--radius-md);
        background: none;
        cursor: pointer;
        white-space: nowrap;
        transition: background-color 120ms ease, border-color 120ms ease;
      }

      .btn-primary {
        background: var(--primary);
        color: var(--primary-foreground);
        font-weight: 600;
      }

      .btn-primary:hover {
        background: color-mix(in oklab, var(--primary) 88%, var(--foreground));
      }

      .btn-secondary {
        background: var(--secondary);
        color: var(--secondary-foreground);
        border-color: var(--border);
      }

      .btn-secondary:hover {
        background: var(--accent);
        color: var(--accent-foreground);
      }

      .btn-destructive {
        background: var(--destructive);
        color: var(--destructive-foreground);
        font-weight: 600;
      }

      .btn-destructive:hover {
        background: color-mix(in oklab, var(--destructive) 88%, var(--foreground));
      }

      .btn:focus-visible,
      .nav-item:focus-visible,
      .icon-btn:focus-visible,
      .tb-btn:focus-visible,
      .group-head:focus-visible,
      .candidate-item:focus-visible,
      .snapshot:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }

      /* 状态胶囊：圆角背景 + 语义色，用于运行状态与活动状态 */
      .badge,
      .pill {
        display: inline-flex;
        align-items: center;
        gap: var(--space-1);
        padding: 2px var(--space-3);
        border: 1px solid;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }

      /* THEMES.md 无 success/warning 语义色：成功复用 secondary，警告复用 accent */
      .badge-ok,
      .pill-ok {
        /* 徽标统一用 muted 底 + foreground 字：secondary 在暗色下本身就是亮色，
           配 foreground 会变成白字白底。语义靠边框与符号前缀区分。 */
        background: var(--muted);
        border-color: var(--border);
        color: var(--foreground);
      }

      /* 状态符号：只上色，不带胶囊背景（胶囊只给状态文字用） */
      .t-ok {
        color: var(--foreground);
      }

      .t-warn {
        color: var(--primary);
      }

      .t-danger {
        color: var(--destructive);
      }

      .t-dim {
        color: var(--muted-foreground);
      }

      .badge-warn,
      .pill-warn {
        background: color-mix(in oklab, var(--accent) 70%, transparent);
        border-color: var(--primary);
        color: var(--accent-foreground);
      }

      .badge-danger,
      .pill-danger {
        background: color-mix(in oklab, var(--destructive) 22%, transparent);
        border-color: var(--destructive);
        color: var(--destructive);
      }

      .badge-dim,
      .pill-dim {
        background: var(--muted);
        border-color: var(--border);
        color: var(--muted-foreground);
      }

      /* 卡片 */
      .kpi-card {
        display: flex;
        flex-direction: column;
        gap: var(--space-1);
        padding: var(--space-3) var(--space-4);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
      }

      .kpi-label {
        font-size: 12px;
        color: var(--muted-foreground);
      }

      .kpi-value {
        font-size: 20px;
        font-weight: 600;
        font-family: var(--font-mono);
        color: var(--foreground);
      }

      /* 空态与加载骨架 */
      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        height: 100%;
        color: var(--muted-foreground);
        text-align: center;
      }


      .skeleton {
        background: var(--muted);
        border-radius: var(--radius-sm);
        animation: pulse 1.4s ease-in-out infinite;
      }

      @keyframes pulse {
        50% {
          opacity: 0.5;
        }
      }

      /* ---------- 原型工具栏（不属于 Glimpse 窗口内容） ---------- */
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-3) var(--space-4);
        width: var(--win-w);
        max-width: 100%;
        padding: var(--space-3) var(--space-4);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
      }

      .toolbar-group {
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }

      .tb-btn {
        height: 28px;
        padding: 0 var(--space-3);
        font-size: 12px;
        color: var(--foreground);
        background: var(--background);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        cursor: pointer;
      }

      .tb-btn:hover {
        background: var(--accent);
        color: var(--accent-foreground);
      }

      .tb-btn.is-active {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--primary-foreground);
        font-weight: 600;
      }

      /* ═══════════════════════════════════════════════════════════════
      /* ═══════════════════════════════════════════════════════════════
      /* ═══════════════════════════════════════════════════════════════
         状态页：4 张 KPI 卡 + 占用条 + sparkline + 可滚动 JSON 区
         内宽 572 = 4 × 137 + 3 × 8 间隔
         ═══════════════════════════════════════════════════════════════ */
      .kpi-grid {
        flex: none;
        display: grid;
        grid-template-columns: repeat(4, 137px);
        gap: var(--space-2);
        height: 88px;
      }

      .meter-row {
        flex: none;
        display: flex;
        align-items: center;
        gap: var(--space-3);
        height: 20px;
      }

      .meter-label {
        flex: none;
        width: 64px;
        font-size: 12px;
        color: var(--muted-foreground);
      }

      /* 占用条：真像素宽度，不是字符画 */
      .meter-track {
        flex: none;
        display: flex;
        gap: 2px;
        width: 240px;
      }

      .meter-seg {
        flex: 1;
        height: 10px;
        background: var(--muted);
        border-radius: 2px;
      }

      .meter-seg.is-on {
        background: var(--primary);
      }

      .meter-value {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--foreground);
      }

      /* sparkline：8 级柱，柱高按值归一化 */
      .spark {
        flex: none;
        display: flex;
        align-items: flex-end;
        gap: 3px;
        height: 20px;
      }

      .spark-bar {
        width: 10px;
        background: var(--chart-1);
        border-radius: 2px 2px 0 0;
      }

      .status-meta {
        flex: none;
        margin: 0;
        font-size: 12px;
        color: var(--muted-foreground);
      }

      .snapshot-head {
        flex: none;
        display: flex;
        align-items: center;
        gap: var(--space-2);
        font-size: 12px;
        color: var(--muted-foreground);
      }

      .snapshot-head::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }
      /* ═══════════════════════════════════════════════════════════════
         footer：info bar + 关闭按钮
         ═══════════════════════════════════════════════════════════════ */
      .app-footer {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-4);
        height: var(--h-footer);
        padding: 0 var(--space-6);
        border-top: 1px solid var(--border);
      }

      .info-bar {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        font-size: 12px;
        color: var(--muted-foreground);
        overflow: hidden;
        white-space: nowrap;
      }

      .info-key {
        color: var(--muted-foreground);
      }

      .info-val {
        font-family: var(--font-mono);
        color: var(--foreground);
      }

      .info-sep {
        color: var(--border);
      }

      /* 错误横幅：saveUserConfig 失败时的表达（principles.md 要求错误态） */
      .error-banner {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        margin-bottom: var(--space-4);
        padding: var(--space-3) var(--space-4);
        font-size: 13px;
        color: var(--destructive);
        background: color-mix(in oklab, var(--destructive) 12%, transparent);
        border: 1px solid var(--destructive);
        border-radius: var(--radius-md);
      }


      .skeleton-block {
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
      }


      /* 原始 JSON 区：保留可滚动（对齐现役 buildGlimpseHtml），等宽是功能需求 */
      .snapshot {
        flex: 1;
        margin: 0;
        padding: var(--space-3) var(--space-4);
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.6;
        color: var(--foreground);
        background: var(--muted);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        min-height: 0;
        overflow: auto;
        white-space: pre;
      }
      /* ═══════════════════════════════════════════════════════════════
         设置页：5 组手风琴 + 底部固定详情面板
         内容区内高 452（500 − 48 padding）= 列表区 + 16 间隔 + 详情 72
         ═══════════════════════════════════════════════════════════════ */
      .settings-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }

      .settings-groups {
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
      }

      .group {
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        overflow: hidden;
      }

      .group-head {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        width: 100%;
        height: 44px;
        padding: 0 var(--space-4);
        background: var(--muted);
        border: 0;
        text-align: left;
        cursor: pointer;
        transition: background-color 120ms ease;
      }

      .group-head:hover {
        background: var(--accent);
        color: var(--accent-foreground);
      }

      .group-arrow {
        flex: none;
        width: 12px;
        color: var(--primary);
        font-family: var(--font-mono);
      }

      .group-name {
        flex: 1;
        font-weight: 600;
        color: var(--foreground);
      }

      .group-count {
        flex: none;
        font-size: 12px;
        color: var(--muted-foreground);
      }

      .group-body {
        display: flex;
        flex-direction: column;
      }


      /* 字段行三列：标签 / 当前值 / 备注 */
      .field-row {
        display: grid;
        grid-template-columns: 180px 180px 1fr;
        align-items: center;
        gap: var(--space-3);
        height: 36px;
        padding: 0 var(--space-4);
        border-top: 1px solid var(--border);
        cursor: pointer;
      }

      .field-row:hover {
        background: var(--accent);
      }

      .field-row.is-focused {
        background: var(--accent);
        color: var(--accent-foreground);
      }

      .f-label {
        color: var(--muted-foreground);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .f-value {
        font-family: var(--font-mono);
        font-weight: 600;
        color: var(--foreground);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .f-note {
        font-size: 12px;
        color: var(--muted-foreground);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .field-row.is-locked .f-label,
      .field-row.is-locked .f-value {
        color: var(--muted-foreground);
      }

      .field-row.is-action .f-value {
        color: var(--primary);
      }

        flex-direction: column;
        justify-content: center;
        gap: var(--space-1);
        height: 72px;
        padding: var(--space-3) var(--space-4);

         ═══════════════════════════════════════════════════════════════ */
      .table-wrap {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow-y: auto;
      }

      .tr {
        display: grid;
        grid-template-columns: 40px 100px 80px minmax(80px, 1fr) 120px 80px;
        align-items: center;
        gap: var(--space-2);
        padding: var(--space-2) var(--space-3);
        border-radius: var(--radius-md);
      }

      /* 数据行悬停整行淡色背景；表头行不参与 */
      .tr:not(.tr-head):hover {
        background: var(--muted);
      }

      .tr-head {
        padding-bottom: var(--space-2);
        font-size: 12px;
        color: var(--muted-foreground);
      }

      /* 表头下的分隔线：跨满六列，占一整行 */

        grid-template-columns: 1fr;
        padding: 0 var(--space-3);
      }

      .tr-divider span {
        display: block;
        height: 1px;
        background: var(--border);
      }

      .td {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;

        font-family: var(--font-mono);
        text-align: center;

      .td-mono {
        font-family: var(--font-mono);
        font-size: 13px;
      }

      .td-muted {
        color: var(--muted-foreground);
      }
      /* ═══════════════════════════════════════════════════════════════
         待审页：240px 列表 + 详情分栏
         内容区内宽 620 − 48（左右 padding 各 24）= 572，
         列表固定 240，间隔 16，详情吃剩余 316。
         ═══════════════════════════════════════════════════════════════ */
      .pane-split {
        display: flex;
        gap: var(--space-4);
        height: 100%;
        min-height: 0;
      }

      .pane-left {
        flex: none;
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
        width: 240px;
        min-height: 0;

      .pane-title {
        flex: none;
        margin: 0;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted-foreground);

      .candidate-list {
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
        min-height: 0;
        overflow-y: auto;

      .candidate-item {
        display: flex;
        align-items: center;
        justify-content: space-between;

        cursor: pointer;

        color: var(--accent-foreground);
      }

      .pane-right {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: var(--space-4);
        min-width: 0;
        min-height: 0;
      }

      .detail-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
        padding: var(--space-4);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        min-height: 0;
        overflow-y: auto;

        display: grid;

        gap: var(--space-3);

        color: var(--muted-foreground);

        flex: none;

        gap: var(--space-2);

         header：标题 + 状态徽标 + 主题/语言开关

      .app-header {

function renderChrome() {
  document.getElementById("app-name").textContent = t("app.name");

  // 状态徽标：运行中 / 已暂停，颜色随状态切换
  var badge = document.getElementById("P0-1-B1");
  badge.textContent = (DEMO.paused ? "○ " : "● ") + t(DEMO.paused ? "app.paused" : "app.running");
  badge.className = "badge " + (DEMO.paused ? "badge-dim" : "badge-ok");

  // 导航项：标签 + 待审计数
  ["pending", "recent", "settings", "status"].forEach(function (key) {
    var el = document.getElementById(NAV_SHORT[key]);
    el.innerHTML =
      "<span>" + esc(t("nav." + key)) + "</span>" +
      (key === "pending"
        ? '<span class="nav-count">' + DEMO.pending + "</span>"
        : "");
  });

  // 开关：按钮文字随当前状态变化
  var themeBtn = document.getElementById("P0-1-W1");
  var dark = document.documentElement.classList.contains("dark");
  themeBtn.textContent = dark ? "◐" : "◑";
  themeBtn.setAttribute("aria-label", t("toggle.theme"));

  var langBtn = document.getElementById("P0-1-W2");
  langBtn.textContent = lang === "zh-CN" ? "文" : "EN";
  langBtn.setAttribute("aria-label", t("toggle.lang"));

  document.getElementById("P0-1-B2").textContent = t("close");
}

/**
 * 语言或主题变化后重画全部区域。
 * 各页面的 render 函数在后续任务里补进来，这里只按存在性调用，
 * 避免在页面尚未实现时报错。
 */
function renderAll() {
  renderChrome();
  renderFooter();
  renderToolbar();
  renderPending();
  renderRecent();
  renderSettings();
  renderStatus();
}

/* ═══════════════════════════════════════════════════════════════════
   偏好持久化：主题与语言写 localStorage，首帧前由 head 脚本应用。
   ═══════════════════════════════════════════════════════════════════ */
var PREFS_KEY = "xpi-memo-glimpse-proto";

function loadPrefs() {
  try {
    return JSON.parse(localStorage.getItem(PREFS_KEY) || "{}");
  } catch (e) {
    return {};
  }
}

function savePrefs() {
  try {
    localStorage.setItem(
      PREFS_KEY,
      JSON.stringify({
        theme: document.documentElement.classList.contains("dark") ? "dark" : "light",
        lang: lang
      })
    );
  } catch (e) {
    /* 存不进去不影响当前会话 */
  }
}

document.getElementById("P0-1-W1").addEventListener("click", function () {
  document.documentElement.classList.toggle("dark");
  renderChrome();
  savePrefs();
});

document.getElementById("P0-1-W2").addEventListener("click", function () {
  lang = lang === "zh-CN" ? "en" : "zh-CN";
  document.documentElement.lang = lang;
  renderAll();
  savePrefs();
});

/* 关闭按钮：Glimpse 桥接存在时调它；原型里只做视觉反馈。 */
document.getElementById("P0-1-B2").addEventListener("click", function () {
  if (window.glimpse && typeof window.glimpse.close === "function") window.glimpse.close();

/* ---------- 短码映射：HTML id 与字典 short 一致 ---------- */
var GROUP_SHORT = {
  retrieval: "P3-1-B1",
  storage: "P3-1-B2",
  pipeline: "P3-1-B3",
  display: "P3-1-B4",
  privacy: "P3-1-B5"
};

var FIELD_SHORT = {
  recallPolicy: "P3-1-S1",
  retrievalMode: "P3-1-S2",
  searchBackend: "P3-1-S3",
  limit: "P3-1-S4",
  globalLimit: "P3-1-S5",
  projectLimit: "P3-1-S6",
  confirmStore: "P3-1-S7",
  autoExport: "P3-1-S8",
  offlineExtractionEnabled: "P3-1-S9",
  excludeToolResults: "P3-1-S10",
  dataDir: "P3-1-S11",
  paused: "P3-1-S12",
  l0Enabled: "P3-1-S13",
  profileInjection: "P3-1-S14",
  language: "P3-1-S15",
  eventPresentation: "P3-1-S16",
  passiveFeedback: "P3-1-S17",
  privacy: "P3-1-S18",
  sleepMode: "P3-1-S19",
  sleep: "P3-1-S20"
};

/* 默认只展开首组：其余四组折叠，用户点击展开 */
var openGroups = { retrieval: true };
var focusedField = null;

/* 已由环境变量锁定的字段：变量存在则只读，值不可改（对应现役 settingsItems 的 Boolean(env[name])）。 */
var envLocked = {};

/** 字段文案按语言取；语言键在数据里是 zh / en。 */
function fieldCopy(field) {
  return field[lang === "en" ? "en" : "zh"];
}

/** 组文案（名称与详解）按语言取。 */
function groupCopy(group) {
  return lang === "en"
    ? { name: group.en, detail: group.enDetail, choice: group.enChoice }
    : { name: group.zh, detail: group.zhDetail, choice: group.zhChoice };
}

/**
 * 25 个元素是静态的，这里只填文字与切换折叠 —— 不替换容器 innerHTML。
 * 静态化让 id 在 HTML 源码里可 grep，也避免重绘冲掉注入的属性。
 */
function renderSettings() {
  GROUPS.forEach(function (group) {
    var copy = groupCopy(group);
    var open = Boolean(openGroups[group.id]);

    var head = document.getElementById(GROUP_SHORT[group.id]);
    head.setAttribute("aria-expanded", String(open));
    head.innerHTML =
      '<span class="group-arrow">' + (open ? "▾" : "▸") + "</span>" +
      '<span class="group-name">' + esc(copy.name) + "</span>" +
      '<span class="group-count">' + group.fields.length + "</span>";

    // 折叠用 hidden，DOM 不删
    head.parentNode.querySelector(".group-body").hidden = !open;

    group.fields.forEach(function (field) {
      var f = fieldCopy(field);
      var locked = Boolean(field.env && envLocked[field.key]);
      var el = document.getElementById(FIELD_SHORT[field.key]);
      el.className =
        "field-row" +
        (locked ? " is-locked" : "") +
        (field.action ? " is-action" : "") +
        (focusedField === field.key ? " is-focused" : "");
      el.innerHTML =
        '<span class="f-label">' + esc(f.label) + "</span>" +
        '<span class="f-value">' +
        esc(field.action ? "↵ " + field.value : field.value) +
        "</span>" +
        '<span class="f-note">' +
        esc(locked ? "⊘ " + field.env : f.note) +
        "</span>";
    });
  });

  renderSettingsDetail();
}

/**
 * 底部详解区恒两行。组头行给出该组的一句话作用与规模 —— 留空会在
 * 列表底部露出空洞，看起来像布局断裂而不是留白（继承 TUI 版的修正）。
 */
function renderSettingsDetail() {
  var line1 = document.getElementById("settings-detail-1");
  var line2 = document.getElementById("settings-detail-2");

  if (focusedField) {
    for (var i = 0; i < GROUPS.length; i++) {
      var found = GROUPS[i].fields.filter(function (f) {
        return f.key === focusedField;
      })[0];
      if (found) {
        var f = fieldCopy(found);
        line1.textContent = f.detail;
        line2.textContent = f.choice;
        return;
      }
    }
  }

  // 没有聚焦字段时显示第一个展开组的说明
  var first = GROUPS[0];
  for (var j = 0; j < GROUPS.length; j++) {
    if (openGroups[GROUPS[j].id]) {
      first = GROUPS[j];
      break;
    }
  }
  var copy = groupCopy(first);
  line1.textContent = copy.detail;
  line2.textContent = copy.choice;
}

function toggleGroup(id) {
  openGroups[id] = !openGroups[id];
  renderSettings();
}

function focusField(key) {
  focusedField = key;
  renderSettings();
}

/* ═══════════════════════════════════════════════════════════════════
   P4 状态：4 张 KPI 卡 + 占用条 + sparkline + 可滚动 JSON
   现役 buildGlimpseHtml 已有 4 卡 + JSON 的骨架；这里补齐占用条与
   趋势，并把 JSON 区做成可滚动。
   ═══════════════════════════════════════════════════════════════════ */
var STATUS_CARDS = [
  { short: "P4-1-C1", key: "status.bank", value: "xpi-memo" },
  { short: "P4-1-C2", key: "status.records", value: "166" },
  { short: "P4-1-C3", key: "status.disk", value: "420.5 KB" },
  { short: "P4-1-C4", key: "status.today", value: "+14" }
];

/** 近 7 日每日事件量（演示数据；现役 MemoryStatus 无此聚合字段）。 */
var DAILY = [1, 2, 3, 5, 7, 6, 4];

var STATUS_JSON = [
  '{',
  '  "retrieval": { "mode": "fts5", "embeddingAvailable": false },',
  '  "storage": { "dataDir": "~/.pi/agent/xpi-memo", "audit": true },',
  '  "counts": { "project": 166, "global": 128, "session": 9 },',
  '  "pendingCandidates": 3,',
  '  "todayStored": 14,',
  '  "paused": false,',
  '  "consistency": { "memoryProjection": "complete" },',
  '  "embedding": { "model": null, "mode": "off" },',
  '  "doctor": null',
  '}'
].join("\n");

var METER_SEGMENTS = 20;

function renderStatus() {
  // 卡片是静态的（id = 字典短码），这里只填文字，不替换容器 innerHTML。
  STATUS_CARDS.forEach(function (card) {
    var el = document.getElementById(card.short);
    el.innerHTML =
      '<span class="kpi-label">' + esc(t(card.key)) + "</span>" +
      '<span class="kpi-value">' + esc(card.value) + "</span>";
  });

  // 占用条：分子为今日事件量，分母为近七日峰值
  var today = DAILY[DAILY.length - 1];
  var peak = Math.max.apply(null, DAILY);
  var on = peak > 0 ? Math.round((today / peak) * METER_SEGMENTS) : 0;
  var segs = [];
  for (var i = 0; i < METER_SEGMENTS; i++) {
    segs.push('<span class="meter-seg' + (i < on ? " is-on" : "") + '"></span>');
  }
  document.getElementById("P4-1-U1").innerHTML = segs.join("");
  document.getElementById("status-usage-label").textContent = t("status.usage");
  document.getElementById("status-usage-value").textContent =
    (peak > 0 ? Math.round((today / peak) * 100) : 0) + "%";

  // sparkline：柱高按峰值归一化到 20px
  document.getElementById("P4-1-U2").innerHTML = DAILY.map(function (v) {
    var h = peak > 0 ? Math.max(2, Math.round((v / peak) * 20)) : 2;
    return '<span class="spark-bar" style="height: ' + h + 'px"></span>';
  }).join("");
  document.getElementById("status-trend-label").textContent = t("status.trend");

  document.getElementById("status-recall").textContent = t("status.recall");
  document.getElementById("status-snapshot-title").textContent = t("status.snapshot");
  document.getElementById("P4-1-A2").textContent = STATUS_JSON;
}

/* ═══════════════════════════════════════════════════════════════════
   footer：info bar 六段

/* ═══════════════════════════════════════════════════════════════════
   原型状态开关：空态 / 加载 / 错误
   三者互斥，作用在对应的页面上。
   ═══════════════════════════════════════════════════════════════════ */
var emptyMode = false;
var loadingMode = false;
var errorMode = false;

var PENDING_FULL = CANDIDATES.slice();
var RECENT_FULL = ACTIVITY.slice();

function applyStateModes() {
  // 空态：清空两个列表页的数据
  if (emptyMode) {
    CANDIDATES.length = 0;
    ACTIVITY.length = 0;
  } else {
    CANDIDATES.length = 0;
    CANDIDATES.push.apply(CANDIDATES, PENDING_FULL);
    ACTIVITY.length = 0;
    ACTIVITY.push.apply(ACTIVITY, RECENT_FULL);
  }
  renderPending();
  renderRecent();

  // 加载态与错误态作用在设置页
  document.getElementById("settings-loading").hidden = !loadingMode;
  document.getElementById("settings-error").hidden = !errorMode;
  document.getElementById("settings-error").textContent = errorMode ? t("error.save") : "";
  document.querySelector("#page-settings .settings-scroll").hidden = loadingMode;

  document.getElementById("state-toggle").classList.toggle("is-active", emptyMode);
  document.getElementById("loading-toggle").classList.toggle("is-active", loadingMode);
  document.getElementById("error-toggle").classList.toggle("is-active", errorMode);
}

document.getElementById("state-toggle").addEventListener("click", function () {
  emptyMode = !emptyMode;
  applyStateModes();
});

document.getElementById("loading-toggle").addEventListener("click", function () {
  loadingMode = !loadingMode;
  applyStateModes();
});

document.getElementById("error-toggle").addEventListener("click", function () {
  errorMode = !errorMode;
  applyStateModes();
});

/* 原型工具栏按钮文案随语言变化 */
function renderToolbar() {
  document.getElementById("state-toggle").textContent = t("state.empty");
  document.getElementById("loading-toggle").textContent = t("state.loading");
  document.getElementById("error-toggle").textContent = t("state.error");
}

/* ═══════════════════════════════════════════════════════════════════
   导航与键盘
   点击导航改 hash，路由由 hashchange 统一处理。
   ═══════════════════════════════════════════════════════════════════ */
Array.prototype.forEach.call(document.querySelectorAll(".nav-item"), function (nav) {
  nav.addEventListener("click", function () {
    location.hash = "#/" + nav.dataset.tab;
  });
});

/* 待审列表点击切换焦点 */
document.getElementById("P1-1-L1").addEventListener("click", function (event) {
  var item = event.target.closest("[data-index]");
  if (item) selectCandidate(Number(item.dataset.index));
});

/* 设置页：点击组头折叠，点击字段行聚焦 */
document.getElementById("P3-1-L1").addEventListener("click", function (event) {
  var head = event.target.closest(".group-head");
  if (head) {
    toggleGroup(head.dataset.group);
    return;
  }
  var row = event.target.closest(".field-row");
  if (row) focusField(row.dataset.field);
});

function activePage() {
  var page = document.querySelector(".tabpage.is-active");
  return page ? page.dataset.page : "pending";
}

document.addEventListener("keydown", function (event) {
  var name = activePage();
  if (name === "pending") {
    if (event.key === "ArrowUp") {
      event.preventDefault();
      selectCandidate(selectedCandidate - 1);
    } else if (event.key === "ArrowDown") {
      event.preventDefault();
      selectCandidate(selectedCandidate + 1);
    }
    return;
  }
  if (name === "settings") {
    if (event.key === "Escape") {
      event.preventDefault();
      focusedField = null;
      renderSettings();
    }
  }
  if (event.key === "Escape" && window.glimpse && typeof window.glimpse.close === "function") {
    window.glimpse.close();
  }
});
/* 骨架最小路由：hashchange 驱动 .tabpage 切换（1.9 填充完整交互） */
(function () {
  var pages = Array.prototype.slice.call(document.querySelectorAll(".tabpage"));
  var navs = Array.prototype.slice.call(document.querySelectorAll(".nav-item"));

  function routeFromHash() {
    var hash = location.hash || "#/pending";
    for (var i = 0; i < pages.length; i++) {
      if (pages[i].dataset.route === hash) return pages[i];
    }
    return pages[0];
  }

  function applyRoute() {
    var target = routeFromHash();
    pages.forEach(function (page) {
      var active = page === target;
      page.classList.toggle("is-active", active);
      if (!active) page.setAttribute("hidden", "");
      else page.removeAttribute("hidden");
    });
    var name = target.dataset.page;
    navs.forEach(function (nav) {
      nav.classList.toggle("is-active", nav.dataset.tab === name);
    });
  }

  window.addEventListener("hashchange", applyRoute);
  applyRoute();
})();

/* ═══ 启动：先读偏好，再画 chrome ═══ */
(function boot() {
  var prefs = loadPrefs();
  if (prefs.lang === "en" || prefs.lang === "zh-CN") lang = prefs.lang;
  document.documentElement.lang = lang;
  renderAll();
})();
</script>
